# Publishes every package (the root one and each packages/*) whose version npm doesn't have yet,
# when it reaches main. Releasing = bump that package's "version" in a PR; merging it publishes.
# Auth is npm trusted publishing (OIDC: no stored token). Only a package's very first publish, before
# it exists on npm, uses a short-lived NPM_TOKEN secret, deleted afterwards (README "Releasing").
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing + provenance (links each release to this run)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm 11.5+
      - run: npm ci
      - run: npm run check
      - name: Publish each package whose version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          failed=0
          for dir in . packages/*; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; nothing to publish."
            elif (cd "$dir" && npm publish); then
              echo "Published $name@$version."
            else
              echo "::error::Publishing $name@$version failed. Is this repo its trusted publisher on npmjs.com, or (a new package) is NPM_TOKEN set? README 'Releasing'."
              failed=1
            fi
          done
          exit $failed
